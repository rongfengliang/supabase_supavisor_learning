services:
  db:
    image: postgres:18.4
    ports:
      - "6432:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
  dbv1:
    image: postgres:18.4
    ports:
      - "6433:5432"
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
  supavisor:
    image: supabase/supavisor:2.9.13
    depends_on:
      - db
    ports:
      - "4000:4000"
      - "5432:5432"
      - "6543:6543"
    environment:
      PORT: 4000
      PROXY_PORT_SESSION: 5432
      PROXY_PORT_TRANSACTION: 6543
      DATABASE_URL: ecto://postgres:postgres@db:5432/postgres
      CLUSTER_POSTGRES: "true"
      REGION: local
      ERL_AFLAGS: -proto_dist inet_tcp
      # For local development only. Replace with secure secrets in production.
      SECRET_KEY_BASE: 81DlbV2kfOL15Q5YLJ2mHVcBfeQKiwsGHbvHzYea4VGZDvgmWUwQQMz41uZiWhTE
      VAULT_ENC_KEY: 91fa362fe6041f439b81382bdd167d2e
      API_JWT_SECRET: 91fa362fe6041f439b81382bdd167d2e
      METRICS_JWT_SECRET: 91fa362fe6041f439b81382bdd167d2e
    command: sh -c "/app/bin/migrate && /app/bin/server"